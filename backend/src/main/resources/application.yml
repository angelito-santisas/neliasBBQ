spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: nelias-bbq
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: filesystem:${DB_MIGRATIONS_PATH:../database/migrations}
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  webhook:
    order-created-url: ${ORDER_WEBHOOK_URL:}
    secret: ${ORDER_WEBHOOK_SECRET:}
